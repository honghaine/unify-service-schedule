openapi: 3.0.3
info:
  title: Unified Service Scheduler API
  description: >
    Dealership appointment scheduler (Keyloop assessment, Scenario A).
    Auto-assigns a qualified technician and free service bay for a
    requested vehicle/service/dealership/time window (or a caller-chosen
    technician), guaranteeing no two confirmed appointments overlap on the
    same technician or bay (enforced via MySQL pessimistic locking — see
    docs/design.md §3). A guest customer/vehicle can be created inline on
    booking; no separate signup step.
  version: "2.0.0"
servers:
  - url: http://localhost:8080
    description: Local (docker compose up --build)

paths:
  /appointments:
    post:
      summary: Book an appointment
      description: >
        Bay is always auto-assigned. Technician is auto-assigned (first
        qualified: specialty matches serviceType, same dealershipId, free
        for the window) unless technicianId is given explicitly, in which
        case that technician is locked and availability-checked directly.
        vehicleId identifies an existing vehicle; omit it and supply the
        guest fields instead to find-or-create the customer (by email) and
        vehicle (by VIN) inline. Duplicate concurrent submits of the same
        request (same time/dealership/service/technician/customer) are
        rejected with 409 via a server-derived dedup key — no client
        header needed.
      operationId: createAppointment
      parameters:
        - name: X-Correlation-Id
          in: header
          required: false
          description: Optional; generated by the server if omitted, echoed back on the response.
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateAppointmentRequest"
            examples:
              existingVehicle:
                summary: Existing vehicle, auto-assigned technician
                value:
                  vehicleId: 1
                  serviceType: OIL_CHANGE
                  dealershipId: 1
                  desiredStart: "2026-09-01T09:00:00"
                  desiredEnd: "2026-09-01T10:00:00"
              guestWithChosenTechnician:
                summary: Guest booking, explicit technician
                value:
                  serviceType: OIL_CHANGE
                  dealershipId: 1
                  technicianId: 1
                  desiredStart: "2026-09-01T09:00:00"
                  desiredEnd: "2026-09-01T10:00:00"
                  customerName: Alex Guest
                  customerEmail: alex@example.com
                  customerPhone: "555-0100"
                  vehicleVin: 1HGCM82633A004999
                  vehicleMake: Honda
                  vehicleModel: Civic
      responses:
        "201":
          description: Appointment confirmed
          headers:
            X-Correlation-Id:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppointmentResponse"
        "400":
          description: >
            Validation failure: missing required field, desiredEnd not
            after desiredStart, or neither vehicleId nor the full guest
            field set was provided.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: vehicleId does not exist, or technicianId does not exist / is not at dealershipId
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: >
            No qualified technician (or the requested technicianId) is
            available for the window, no service bay is available, or a
            request with the same derived dedup key is already in flight.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /appointments/{id}:
    get:
      summary: Get an appointment by id
      operationId: getAppointment
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        "200":
          description: Appointment found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppointmentResponse"
        "404":
          description: No appointment with that id
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /technicians/{id}/availability:
    get:
      summary: Get one technician's confirmed busy windows for a given day
      operationId: getTechnicianAvailability
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
        - name: date
          in: query
          required: true
          schema:
            type: string
            format: date
      responses:
        "200":
          description: Busy windows for the day
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AvailabilityResponse"
        "404":
          description: No technician with that id
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /technicians/availability:
    get:
      summary: Get every qualified technician's busy windows for a day
      description: >
        Used by the booking calendar/slot picker, which doesn't know a
        technician id up front — returns all technicians matching
        dealershipId + serviceType, each with their busy windows for date.
      operationId: getTechnicianAvailabilityForService
      parameters:
        - name: dealershipId
          in: query
          required: true
          schema:
            type: integer
            format: int64
        - name: serviceType
          in: query
          required: true
          schema:
            type: string
            example: OIL_CHANGE
        - name: date
          in: query
          required: true
          schema:
            type: string
            format: date
      responses:
        "200":
          description: One entry per qualified technician
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TechnicianAvailability"

components:
  schemas:
    CreateAppointmentRequest:
      type: object
      description: >
        Either vehicleId, or the full guest set (customerName,
        customerEmail, vehicleVin, vehicleMake, vehicleModel) must be
        present — enforced at validation time (400 if neither).
      required: [serviceType, dealershipId, desiredStart, desiredEnd]
      properties:
        vehicleId:
          type: integer
          format: int64
          nullable: true
          description: Existing vehicle. Omit for a guest booking.
        serviceType:
          type: string
          example: OIL_CHANGE
        dealershipId:
          type: integer
          format: int64
        desiredStart:
          type: string
          format: date-time
        desiredEnd:
          type: string
          format: date-time
          description: Must be after desiredStart.
        technicianId:
          type: integer
          format: int64
          nullable: true
          description: Explicit technician choice. Omit to auto-assign.
        customerName:
          type: string
          nullable: true
        customerEmail:
          type: string
          format: email
          nullable: true
        customerPhone:
          type: string
          nullable: true
        vehicleVin:
          type: string
          nullable: true
        vehicleMake:
          type: string
          nullable: true
        vehicleModel:
          type: string
          nullable: true

    AppointmentResponse:
      type: object
      properties:
        id:
          type: integer
          format: int64
        vehicleId:
          type: integer
          format: int64
        vehicleVin:
          type: string
        customerId:
          type: integer
          format: int64
        technicianId:
          type: integer
          format: int64
        technicianName:
          type: string
        serviceBayId:
          type: integer
          format: int64
        bayNumber:
          type: string
        serviceType:
          type: string
        startTime:
          type: string
          format: date-time
        endTime:
          type: string
          format: date-time
        status:
          type: string
          enum: [CONFIRMED, CANCELLED]

    BusyWindow:
      type: object
      properties:
        startTime:
          type: string
          format: date-time
        endTime:
          type: string
          format: date-time

    AvailabilityResponse:
      type: object
      properties:
        technicianId:
          type: integer
          format: int64
        date:
          type: string
          format: date
        busyWindows:
          type: array
          items:
            $ref: "#/components/schemas/BusyWindow"

    TechnicianAvailability:
      type: object
      properties:
        technicianId:
          type: integer
          format: int64
        technicianName:
          type: string
        date:
          type: string
          format: date
        busyWindows:
          type: array
          items:
            $ref: "#/components/schemas/BusyWindow"

    ErrorResponse:
      type: object
      properties:
        status:
          type: integer
        error:
          type: string
        message:
          type: string
        correlationId:
          type: string
        timestamp:
          type: string
          format: date-time
        fieldErrors:
          type: array
          items:
            type: string
