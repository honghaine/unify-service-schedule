spring.application.name=scheduler

# --- Datasource (overridden by docker-compose env vars in compose.yaml) ---
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/scheduler}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:scheduler}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:scheduler}

# --- JPA: Flyway owns the schema, Hibernate must never auto-generate DDL ---
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# --- Flyway ---
spring.flyway.locations=classpath:db/migration

# --- Redis (idempotency lock + candidate-list cache; overridden by docker-compose / Testcontainers) ---
spring.data.redis.host=${SPRING_DATA_REDIS_HOST:localhost}
spring.data.redis.port=${SPRING_DATA_REDIS_PORT:6379}

# --- Actuator / metrics ---
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=always

# --- Structured JSON logging (correlation id injected via MDC, see CorrelationIdFilter) ---
logging.structured.format.console=ecs
